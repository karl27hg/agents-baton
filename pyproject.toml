[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-baton"
dynamic = ["version"]
description = "SQLite-backed CLI for coordinating Codex role handoffs and change requests"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "karl27hg" },
]
keywords = ["codex", "agents", "handoff", "workflow", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/karl27hg/agents-baton"
Repository = "https://github.com/karl27hg/agents-baton"
Issues = "https://github.com/karl27hg/agents-baton/issues"

[project.scripts]
baton = "agents_baton.cli:main"
baton-report = "agents_baton.report:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "agents_baton.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
